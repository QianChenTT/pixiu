# The app's namespace and the network policy that walls it off. They sit in one file so the
# policy is applied together with the namespace: nothing can be created in pixiu before the
# namespace exists, so no pod there ever starts without the policy in place
#
# Pod Security "restricted" is enforced here: a pod that doesn't set the hardening fields is
# refused at admission, whoever submits it
apiVersion: v1
kind: Namespace
metadata:
  name: pixiu
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Every pod in pixiu is cut off from the network, in and out, unless a later policy allows a
# path. k3s's built-in controller enforces it. The API calls nothing outside itself, so even DNS
# stays blocked. Traffic from the pod's own node is always let in, which keeps the kubelet's
# probes working
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: pixiu
spec:
  # An empty selector picks every pod in the namespace, including ones added later
  podSelector: {}
  # Both directions are listed and no rule allows anything, so both are denied
  policyTypes:
    - Ingress
    - Egress
