name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN: read-only unless a job needs more
permissions:
  contents: read
# Every checkout sets persist-credentials: false. No job runs git after checkout, so the token
# is not left on disk for the tools that run later (scanners run with the job's access)

env:
  # Trivy pinned by digest, one pin for the image scan and the config scan: its release channel
  # was compromised in March 2026 (GHSA-69fq-xp46-6x23)
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install runtime dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.txt
      - name: install test dependencies
        run: pip install -r requirements-dev.txt
      - name: run tests (every gate but replay, which has its own job)
        run: pytest -m "not replay"

  # Replay: recorded CloudTrail events run through the real normalizer and the real rules.
  # Its own gate, so a rule that reads a real event wrong, or a normalizer change, reddens
  # here and not only in the unit tests. The test job above excludes these with -m "not replay"
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install runtime dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.txt
      - name: install test dependencies
        run: pip install -r requirements-dev.txt
      - name: replay recorded events through the pipeline
        run: pytest -m replay

  # SCA: the declared runtime dependencies against known advisories
  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install pip-audit
        run: pip install pip-audit==2.10.1
      # Audits the lockfile itself (no install needed): any known vulnerability fails the job
      - name: dependency audit
        run: pip-audit -r requirements.txt --require-hashes --disable-pip

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all commits: a secret added then deleted inside the PR is still caught
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST: our own Python code and the Dockerfile against insecure patterns
  # p/python alone missed eval, pickle and verify=False in a probe of known-bad code
  # and p/security-audit adds them (audit rules flag patterns for review, expect false positives to emerge in the future)
  sast:
    runs-on: ubuntu-24.04
    container:
      # Semgrep CLI image pinned by digest
      image: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b # 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --error: any finding fails this job, --metrics=off: send no usage data to Semgrep
      - name: semgrep scan
        run: semgrep scan --config p/python --config p/security-audit --config p/dockerfile --error --metrics=off

  # Image scan: everything that actually ships (OS packages + Python packages in the built image)
  # Run as a plain container, not through trivy-action and given only the image tar, read-only.
  # Built on arm64, the architecture the node runs and the push job builds
  image-scan:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations after checkout, so do not keep the job token on disk
          # (checkout v6+ writes it to a file under RUNNER_TEMP)
          persist-credentials: false
      - name: build image
        run: docker build -t pixiu:ci .
      - name: export image
        # A dedicated folder: Trivy is given this folder only, not the rest of RUNNER_TEMP
        run: mkdir "$RUNNER_TEMP/image" && docker save pixiu:ci -o "$RUNNER_TEMP/image/pixiu.tar"
      # Report: every finding, including ones with no fix yet, for visibility. Never fails
      - name: image report (all severities)
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          image --input /scan/pixiu.tar --scanners vuln --exit-code 0
      # Gate policy: fail only on HIGH/CRITICAL that have a fix available
      - name: image gate (HIGH+ with a fix)
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          image --input /scan/pixiu.tar --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  # Config scan: the Terraform and the Dockerfile (and the Kubernetes manifests once they exist)
  # against Trivy's misconfiguration checks. Given the checkout read-only
  config-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Report: every finding at every severity, for visibility. Never fails
      - name: config report (all severities)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          config --exit-code 0 /src
      # Gate policy: fail on HIGH/CRITICAL. An accepted finding has a trivy:ignore comment with an
      # expiry date above its resource, and this gate goes red again when the date passes
      - name: config gate (HIGH+)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1 /src

  # Platform plan: on a pull request, what the change would do to the platform in AWS. The role
  # it takes can only read (infra/pixiu/bootstrap/github_plan_role.tf), because a pull request
  # runs code nobody has reviewed yet. Forks and Dependabot get no AWS token or secrets, so
  # their pull requests skip it
  platform-plan:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets the job ask GitHub for the signed token AWS swaps for the plan role
      id-token: write
    defaults:
      run:
        working-directory: infra/pixiu/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Terraform as the laptop. The wrapper is off: it copies every command's output
      # into step outputs, and the plan's output holds values that stay out of the log
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
      - name: init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # The image main runs now, so the plan shows the infrastructure change, not an image swap
      - name: main's image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/qianchentt/pixiu:main | awk '/^Digest:/ {print $2}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The plan's own output is thrown away: it prints the user data and resource IDs. Errors
      # still reach the log
      - name: plan
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >
          terraform plan -input=false -lock-timeout=5m -out=plan.bin
          -var "image_digest=$IMAGE_DIGEST" > /dev/null
      # The count line and what would change and how: addresses and actions, never values
      - name: summary
        run: bash plan-summary.sh plan.bin "Platform plan" >> "$GITHUB_STEP_SUMMARY"

  # Platform plan for approval: on main, with the digest image-push just pushed, the same plan
  # the apply would run. It sits on the run page above the apply job that waits for Han, so he
  # approves what he can see. Same read-only role, which also trusts main
  platform-plan-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/pixiu/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
      - name: init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - name: plan
        env:
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: >
          terraform plan -input=false -lock-timeout=5m -out=plan.bin
          -var "image_digest=$IMAGE_DIGEST" > /dev/null
      - name: summary
        env:
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: |
          {
            bash plan-summary.sh plan.bin "Platform plan for approval"
            echo
            echo "Image \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Push: on a merge to main only, after every gate passed on that same commit. Builds arm64 (the
  # node is a t4g), scans that exact image with the image gate and pushes it only if clean.
  # Pull requests never reach this job, so code that isn't merged can't publish an image
  image-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, replay, sca, secret-scan, sast, image-scan, config-scan]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in token, no personal token
      id-token: write # the short-lived Sigstore certificate that signs the attestation
      attestations: write # store the attestation
      artifact-metadata: write # the attestation's storage record
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR names must be lowercase. Set once from the repo name, never from PR input
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: build image
        run: >
          docker build
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: export image
        run: mkdir "$RUNNER_TEMP/image" && docker save "$IMAGE:sha-$GITHUB_SHA" -o "$RUNNER_TEMP/image/pixiu.tar"
      # The same gate as image-scan, on the exact image about to be pushed
      - name: image gate (HIGH+ with a fix)
        run: >
          docker run --rm -v "$RUNNER_TEMP/image:/scan:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          image --input /scan/pixiu.tar --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # sha-<commit> names the build, main moves to the newest. The node pins neither: it pulls
      # by the digest written to this step's output and the run summary
      - name: push
        id: push
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA" | tee "$RUNNER_TEMP/push.log"
          docker push "$IMAGE:main"
          digest=$(grep -o 'digest: sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/push.log" | head -1 | cut -d' ' -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # Signed build provenance for the digest, stored with GitHub and pushed next to the image.
      # Check it with: gh attestation verify oci://<image>@<digest> --owner <owner>
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Platform apply: after a merge to main, once platform-plan-main has shown the plan, with the
  # digest image-push just pushed. The job runs in the "platform" environment, so GitHub holds
  # it until Han approves, and only then can it get the deploy role (which trusts this
  # environment on main, see infra/pixiu/bootstrap/github_oidc.tf). It plans again after the
  # approval and applies that exact plan. A new digest changes the node's user data, so every
  # deploy replaces the node
  platform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-push, platform-plan-main]
    runs-on: ubuntu-24.04
    environment: platform
    # One apply at a time, never cancelled midway: a cancelled apply can leave AWS half changed
    # and the state lock behind. GitHub keeps one waiting run per group, so a newer merge
    # replaces an older one still waiting for approval
    concurrency:
      group: platform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the job ask GitHub for the signed token AWS swaps for the deploy role
      id-token: write
    defaults:
      run:
        working-directory: infra/pixiu/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
      - name: init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # Output thrown away for the same reason as the pull request plan: it prints values
      - name: plan
        env:
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: >
          terraform plan -input=false -lock-timeout=5m -out=plan.bin
          -var "image_digest=$IMAGE_DIGEST" > /dev/null
      - name: summary
        env:
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: |
          {
            bash plan-summary.sh plan.bin "Platform apply"
            echo
            echo "Image \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # The saved plan and nothing else. If the state changed since the plan, Terraform refuses
      # the stale plan instead of applying something different
      - name: apply
        run: terraform apply -input=false -lock-timeout=5m plan.bin > /dev/null
