name: AWS trust check

# Proves the deploy role's trust policy. Run by hand from the Actions tab and pick the branch.
# The role only trusts a job in the "platform" environment on main
#   from main            no-environment: AWS refuses at the assume step (red)
#                        in-environment: waits for Han's approval, then gets the role (green)
#   from another branch  no-environment: AWS refuses (red)
#                        in-environment: GitHub refuses to start it, main is the only branch
#                        allowed into the environment (red)
# A successful run only asks who it is. It never plans or applies
on:
  workflow_dispatch:

# Nothing by default. The jobs below ask for exactly what they need
permissions: {}

jobs:
  no-environment:
    runs-on: ubuntu-latest
    permissions:
      # Lets this job ask GitHub for the signed token that says which repo and branch it runs on.
      # It grants nothing in the repo itself
      id-token: write
    steps:
      # No checkout: the job never reads the repo's code
      - name: assume the deploy role with the GitHub token
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The ARN holds the account ID, so it is a secret and GitHub masks it in this public log
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          # Also mask the bare account ID wherever a later step prints it
          mask-aws-account-id: true
      - name: who am I
        run: aws sts get-caller-identity --query Arn --output text

  in-environment:
    runs-on: ubuntu-latest
    environment: platform
    permissions:
      id-token: write
    steps:
      - name: assume the deploy role with the GitHub token
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
      - name: who am I
        run: aws sts get-caller-identity --query Arn --output text
